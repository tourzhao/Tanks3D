name: macOS Godot and shared-core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  godot:
    name: Godot arm64
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Prepare hash-pinned Godot toolchain
        run: make godot-setup
      # test-architecture also compiles historical raylib renderer bridges;
      # the shared-rules job runs it with that dependency installed.
      - name: Check Godot release tools
        run: make test-godot-release
      - name: Check native bridge, sanitizers and real TCP
        run: make -j3 test-godot-core test-godot-core-sanitize test-godot-lan-sockets
      - name: Import scripts, validate presentation and run UI regression
        run: make test-godot-import
      - name: Verify self-contained app and two-process LAN
        run: make test-godot-bundle test-godot-lan
      - name: Preserve Godot failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-failure-${{ github.run_id }}
          path: |
            build/godot/validation/
            build/godot/lan-validation-*/
            build/godot/package/*.log
          retention-days: 14

  build:
    name: Shared rules and historical adapter
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install hash-pinned raylib 6.0
        run: |
          raylib_work="$RUNNER_TEMP/tanks3d-raylib-6.0"
          raylib_prefix="$raylib_work/prefix"
          mkdir -p "$raylib_prefix/include" "$raylib_prefix/lib" "$raylib_prefix/share/licenses/raylib"
          curl --fail --location --retry 3 \
            https://github.com/raysan5/raylib/releases/download/6.0/raylib-6.0_macos.tar.gz \
            --output "$raylib_work/raylib-6.0_macos.tar.gz"
          printf '%s  %s\n' \
            6ae5947fbd36aee4c280e3a2b3e1893316c433e292bda6e94e0f2b037498ad70 \
            "$raylib_work/raylib-6.0_macos.tar.gz" | shasum -a 256 --check
          tar -xzf "$raylib_work/raylib-6.0_macos.tar.gz" -C "$raylib_work"
          cmp "$raylib_work/raylib-6.0_macos/LICENSE" LICENSES/Zlib-raylib.txt
          cp "$raylib_work/raylib-6.0_macos/include/"*.h "$raylib_prefix/include/"
          # The official archive is universal; existing package gates require
          # one architecture. Keep only the runner's static slice, so ordinary
          # test binaries cannot accidentally link an unbundled raylib dylib.
          lipo "$raylib_work/raylib-6.0_macos/lib/libraylib.a" \
            -thin "$(uname -m)" -output "$raylib_prefix/lib/libraylib.a"
          cp "$raylib_work/raylib-6.0_macos/LICENSE" "$raylib_prefix/share/licenses/raylib/LICENSE"
          printf 'RAYLIB_PREFIX=%s\n' "$raylib_prefix" >> "$GITHUB_ENV"

      - name: Clean previous outputs
        run: make clean

      - name: Build warning-clean debug executable
        run: make debug

      - name: Verify Alpha candidate tooling contracts
        run: make test-alpha-candidate

      - name: Verify boundaries, bundle, rules and filtered test entry points
        run: make test-architecture all test test-unit test-session test-assets

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-sanitize test-game-session-adapter test-game-session-adapter-sanitize

      - name: Build and verify self-contained macOS Alpha archive
        run: make test-dist

      - name: Report production coverage
        run: make coverage
